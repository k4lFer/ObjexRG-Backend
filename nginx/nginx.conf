resolver 127.0.0.11 valid=10s ipv6=off;

upstream backend_upstream {
    zone backend_upstream 64k;
    least_conn;
    server objexrg:7080 resolve max_fails=3 fail_timeout=10s;
    keepalive 32;
}

upstream frontend_upstream {
    zone frontend_upstream 64k;
    least_conn;
    server frontend:80 resolve max_fails=3 fail_timeout=10s;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    # Allow large uploads through the backend fallback endpoint.
    client_max_body_size 512m;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header Connection "";

    proxy_connect_timeout 10s;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    proxy_request_buffering off;

    # Backend API, public links and Swagger.
    location ~ ^/(auth|user|bucket|upload|download|share|swagger|f|s)(/|$) {
        proxy_pass http://backend_upstream;
    }

    # React SPA (the frontend container serves it through its own nginx).
    location / {
        proxy_pass http://frontend_upstream;
    }
}
