<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Storage Preview Test</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #0f172a; color: #f8fafc; margin: 0; padding: 2rem; }
        .container { max-width: 900px; margin: 0 auto; }
        .header { background: #1e293b; padding: 1.5rem; border-radius: 8px; margin-bottom: 2rem; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1); }
        .form-group { margin-bottom: 1rem; }
        label { display: block; margin-bottom: 0.5rem; font-weight: 500; color: #94a3b8; }
        input { width: 100%; padding: 0.75rem; border-radius: 4px; border: 1px solid #334155; background: #0f172a; color: #fff; box-sizing: border-box; }
        input:focus { outline: none; border-color: #3b82f6; }
        button { background: #3b82f6; color: white; border: none; padding: 0.75rem 1.5rem; border-radius: 4px; font-weight: bold; cursor: pointer; transition: background 0.2s; }
        button:hover { background: #2563eb; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 1.5rem; }
        .card { background: #1e293b; border-radius: 8px; overflow: hidden; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1); display: flex; flex-direction: column; }
        .preview-area { height: 200px; background: #0f172a; display: flex; align-items: center; justify-content: center; overflow: hidden; }
        .preview-area img, .preview-area video { width: 100%; height: 100%; object-fit: cover; }
        .preview-area .placeholder { color: #475569; font-size: 3rem; }
        .info { padding: 1rem; }
        .filename { font-weight: bold; margin-bottom: 0.5rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .meta { font-size: 0.85rem; color: #94a3b8; }
        .badge { display: inline-block; padding: 0.1rem 0.5rem; background: #3b82f6; color: white; border-radius: 999px; font-size: 0.75rem; margin-top: 0.5rem; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h2>Configuración</h2>
            <div class="form-group">
                <label for="jwt">JWT Token (Bearer)</label>
                <input type="text" id="jwt" placeholder="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...">
            </div>
            <div class="form-group">
                <label for="bucket">Nombre del Bucket</label>
                <input type="text" id="bucket" placeholder="mi-bucket-1">
            </div>
            <button onclick="fetchObjects()">Cargar y Previsualizar</button>
        </div>

        <div id="loading" style="display: none; text-align: center; margin: 2rem 0; color: #3b82f6;">Cargando archivos...</div>
        <div class="grid" id="results"></div>
    </div>

    <script>
        const API_URL = 'http://localhost:7080';

        async function fetchObjects() {
            const token = document.getElementById('jwt').value.trim();
            const bucket = document.getElementById('bucket').value.trim();
            const resultsDiv = document.getElementById('results');
            const loading = document.getElementById('loading');

            if (!token || !bucket) {
                alert('Por favor ingresa tu Token y el nombre del Bucket');
                return;
            }

            resultsDiv.innerHTML = '';
            loading.style.display = 'block';

            try {
                // En este endpoint tenemos la metadata incluyendo mimeType
                const res = await fetch(`${API_URL}/bucket/${bucket}`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                
                const response = await res.json();
                console.log(response);
                
                if (!response.Success) {
                    throw new Error(response.message || 'Error al listar objetos');
                }

                // Dependiendo de cómo lo responda tu envoltorio genérico de respuesta
                const objects = response.Data?.objects || response.Data?.Objects || response.data?.objects || response.objects || [];
                
                if (objects.length === 0) {
                    resultsDiv.innerHTML = '<p>No hay objetos en este bucket.</p>';
                    return;
                }

                for (const obj of objects) {
                    await renderCard(obj, bucket, token);
                }

            } catch (err) {
                alert('Ocurrió un error: ' + err.message);
                console.error(err);
            } finally {
                loading.style.display = 'none';
            }
        }

        async function renderCard(obj, bucket, token) {
            const sizeInKb = (obj.sizeBytes / 1024).toFixed(2);
            
            // Creamos la estructura base
            const card = document.createElement('div');
            card.className = 'card';
            
            const previewArea = document.createElement('div');
            previewArea.className = 'preview-area';
            previewArea.innerHTML = `<span class="placeholder">...</span>`; // Loading
            
            const infoArea = document.createElement('div');
            infoArea.className = 'info';
            infoArea.innerHTML = `
                <div class="filename" title="${obj.fileName}">${obj.fileName}</div>
                <div class="meta">${sizeInKb} KB &bull; ${new Date(obj.createdAt).toLocaleDateString()}</div>
                <span class="badge">${obj.mimeType}</span>
            `;

            card.appendChild(previewArea);
            card.appendChild(infoArea);
            document.getElementById('results').appendChild(card);

            try {
                // Hay que hacer fetch explícito porque necesitamos pasar el JWT por cabeceras
                // Las etiquetas <img> solas no dejan inyectar "Authorization: Bearer X"
                const downloadUrl = `${API_URL}/download/${bucket}/${obj.fileName}`;
                const fileRes = await fetch(downloadUrl, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                if (!fileRes.ok) throw new Error('Error de lectura');
                
                // Creamos un Blob del archivo para ponerlo temporalmente en SRC
                const blob = await fileRes.blob();
                const objectUrl = URL.createObjectURL(blob);

                // Reemplazamos el preview según el mimeType
                if (obj.mimeType.startsWith('image/')) {
                    previewArea.innerHTML = `<img src="${objectUrl}" alt="${obj.fileName}">`;
                } else if (obj.mimeType.startsWith('video/')) {
                    previewArea.innerHTML = `<video src="${objectUrl}" controls></video>`;
                } else if (obj.mimeType.startsWith('audio/')) {
                    previewArea.innerHTML = `<audio src="${objectUrl}" controls style="width:100%"></audio>`;
                } else {
                    // Documentos u otros archivos
                    previewArea.innerHTML = `<span class="placeholder">📄</span>`;
                }
            } catch (err) {
                console.error('No se pudo visualizar:', obj.fileName, err);
                previewArea.innerHTML = `<span class="placeholder">❌</span>`;
            }
        }
    </script>
</body>
</html>
